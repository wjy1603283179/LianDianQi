name: Windows build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install Qt development libraries
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.5.3 win64_msvc2019_64 -O .tools\Qt --archives qtbase
      - name: Build and run QtTest
        shell: powershell
        run: .\scripts\build.ps1
      - name: Package the executable
        shell: powershell
        run: .\scripts\package.ps1
      - name: Verify portable startup without development PATH
        timeout-minutes: 1
        shell: powershell
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          $env:QT_QPA_PLATFORM = 'windows'
          $exe = (Resolve-Path '.\dist\DianXu-1.0.0-windows-x64\LianDianQi.exe').Path
          $preview = Join-Path $env:RUNNER_TEMP 'preview.png'
          $proc = Start-Process -FilePath $exe -ArgumentList "--screenshot `"$preview`"" -WindowStyle Hidden -PassThru
          if (!$proc.WaitForExit(15000)) {
            $proc.Kill()
            throw 'Portable preview did not exit within 15 seconds'
          }
          if ($proc.ExitCode -ne 0 -or !(Test-Path -LiteralPath $preview)) { throw 'Portable startup failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Windows-package-and-tests
          path: |
            dist/*.zip
            dist/*.sha256
            build/test-results.txt
